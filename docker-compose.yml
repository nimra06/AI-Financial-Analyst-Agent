services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finanalyst
      POSTGRES_PASSWORD: finanalyst
      POSTGRES_DB: finanalyst
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finanalyst -d finanalyst"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://finanalyst:finanalyst@postgres:5432/finanalyst
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["python", "-m", "worker.runner"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://finanalyst:finanalyst@postgres:5432/finanalyst
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
